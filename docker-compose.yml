services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinguard-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - clinguard_postgres_data:/var/lib/postgresql/data
      - ./deployment/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: clinguard-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: clinguard-ui
    restart: unless-stopped

    command:
      - streamlit
      - run
      - src/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    environment:
      CLINGUARD_API_URL: http://api:8000

    ports:
      - "8501:8501"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    depends_on:
      api:
        condition: service_healthy

volumes:
  clinguard_postgres_data:
    external: true
    name: clinguard-ai_clinguard_postgres_data
